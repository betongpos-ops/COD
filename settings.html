<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#111827">
  <title>ตั้งค่าระบบ — COD</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <div class="topbar-logo-wrap">
        <img src="/favicon.png"   class="topbar-logo-icon" alt="ไปรษณีย์ไทย">
        <img src="/Topbar-1.png"  class="topbar-logo-full" alt="ไปรษณีย์ไทย">
      </div>
      <div>
        <span class="brand-text">ตั้งค่าระบบ</span>
        <span class="brand-sub" id="branchLabel">-</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-outline btn-sm" onclick="goAdmin()"><i class="fas fa-arrow-left"></i> กลับ Admin</button>
    </div>
  </header>

  <main class="main" style="max-width:640px;margin:0 auto;">

    <!-- ข้อมูลสาขา -->
    <div class="settings-section">
      <div class="settings-section-title"><i class="fas fa-building" style="color:var(--red-500);"></i> ข้อมูลที่ทำการไปรษณีย์</div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">รหัสไปรษณีย์</label>
          <input type="text" id="s_postal_code" readonly class="readonly-input">
        </div>
        <div class="form-group">
          <label class="form-label">ชื่อที่ทำการ</label>
          <input type="text" id="s_name" placeholder="เช่น ที่ทำการไปรษณีย์เบตง">
        </div>
        <div class="form-group">
          <label class="form-label">ชื่อหัวหน้า ปณ.</label>
          <input type="text" id="s_head_name" placeholder="เช่น นายประทีป ชุมนวล">
        </div>
        <div class="form-group">
          <label class="form-label">ตำแหน่ง</label>
          <input type="text" id="s_head_title" placeholder="เช่น หน.ปณ.เบตง">
        </div>
      </div>
      <div style="margin-top:16px;">
        <button class="btn btn-primary btn-sm" onclick="saveBranchInfo()"><i class="fas fa-save"></i> บันทึกข้อมูล</button>
      </div>
    </div>

    <!-- รหัสผ่าน -->
    <div class="settings-section">
      <div class="settings-section-title"><i class="fas fa-key" style="color:var(--amber-600);"></i> รหัสผ่าน</div>
      <div class="info-row">
        <span class="info-key">รหัสพนักงาน (เข้าโหมดพนักงาน)</span>
        <span class="info-value" id="displayPostalCode">-</span>
      </div>
      <p style="font-size:12px;color:var(--gray-500);margin-bottom:16px;">รหัสพนักงานคือรหัสไปรษณีย์ ไม่สามารถเปลี่ยนได้</p>
      <div class="form-group" style="max-width:300px;">
        <label class="form-label">รหัสผ่าน Admin ใหม่</label>
        <input type="password" id="s_new_password" placeholder="รหัสผ่าน Admin ใหม่">
      </div>
      <div class="form-group" style="max-width:300px;margin-top:8px;">
        <label class="form-label">ยืนยันรหัสผ่าน Admin</label>
        <input type="password" id="s_confirm_password" placeholder="ยืนยันรหัสผ่าน">
      </div>
      <div style="margin-top:16px;">
        <button class="btn btn-primary btn-sm" onclick="savePassword()"><i class="fas fa-key"></i> เปลี่ยนรหัสผ่าน</button>
      </div>
    </div>

    <!-- สถิติข้อมูล -->
    <div class="settings-section">
      <div class="settings-section-title"><i class="fas fa-database" style="color:var(--blue-500);"></i> ข้อมูลในระบบ</div>
      <div id="dateStatsList">
        <div class="center-msg"><i class="fas fa-spinner fa-spin" style="font-size:20px;display:block;margin-bottom:6px;"></i><p>กำลังโหลด...</p></div>
      </div>
    </div>

    <!-- ออกจากระบบ -->
    <div class="settings-section">
      <div class="settings-section-title"><i class="fas fa-sign-out-alt" style="color:var(--red-500);"></i> ออกจากระบบ</div>
      <p style="font-size:13px;color:var(--gray-500);margin-bottom:16px;">ออกจากระบบจะล้าง session และกลับไปหน้า Login</p>
      <button class="btn btn-danger" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
    </div>

  </main>
  <footer class="site-footer">© 2026 | 95110 · IMRON SAMOH<br>imron.samoh@gmail.com</footer>
  <script type="module" src="/src/pages/settings.ts"></script>
</body>
</html>
