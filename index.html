<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#111827">
  <title>เข้าสู่ระบบ — COD Parcel System</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body style="background:linear-gradient(135deg,#111827 0%,#1f2937 100%);">

  <div class="login-page">
    <div class="login-card">
      <div class="login-logo-wrap">
        <img src="/Login%20card.png" alt="ไปรษณีย์ไทย" class="login-logo-img">
      </div>
      <h1 class="login-title">ระบบพัสดุ COD</h1>
      <p class="login-sub" id="loginSub">เลือกที่ทำการไปรษณีย์</p>

      <!-- STEP 1: เลือก ปณ. -->
      <div class="login-step active" id="step1">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="branchSearch" placeholder="ค้นหา ปณ. หรือรหัสไปรษณีย์..." oninput="filterBranches()">
        </div>
        <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
          <a href="/register.html" class="register-shortcut">
            <i class="fas fa-plus-circle"></i> ลงทะเบียน ปณ. ใหม่
          </a>
        </div>
        <div id="branchList" class="branch-chips">
          <div class="center-msg">
            <i class="fas fa-spinner fa-spin" style="font-size:24px;display:block;margin-bottom:8px;"></i>
            <p>กำลังโหลด...</p>
          </div>
        </div>
      </div>

      <!-- STEP 2: เลือกโหมด -->
      <div class="login-step" id="step2">
        <div class="info-row" style="margin-bottom:16px;">
          <span class="info-key">ที่ทำการ</span>
          <span class="info-value" id="selectedBranchLabel">-</span>
        </div>
        <div class="mode-btns">
          <button class="mode-btn employee" onclick="chooseMode('employee')">
            <i class="fas fa-user-tag"></i>
            <span>โหมดพนักงาน</span>
            <span style="font-size:11px;font-weight:400;color:var(--gray-400);">ตรวจสอบชิ้นงาน</span>
          </button>
          <button class="mode-btn admin" onclick="chooseMode('admin')">
            <i class="fas fa-user-shield"></i>
            <span>โหมด Admin</span>
            <span style="font-size:11px;font-weight:400;color:var(--gray-400);">จัดการระบบ</span>
          </button>
        </div>
        <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:12px;justify-content:center;" onclick="backToStep1()">
          <i class="fas fa-arrow-left"></i> เปลี่ยน ปณ.
        </button>
      </div>

      <!-- STEP 3: รหัสผ่าน Admin -->
      <div class="login-step" id="step3">
        <p style="font-size:13px;color:var(--gray-500);margin-bottom:16px;">
          กรอกรหัสผ่าน Admin สำหรับ <b id="step3BranchLabel"></b>
        </p>
        <div class="form-group">
          <label class="form-label">รหัสผ่าน Admin</label>
          <input type="password" id="adminPasswordInput" placeholder="รหัสผ่าน Admin"
            onkeydown="if(event.key==='Enter') submitAdminLogin()">
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:16px;justify-content:center;" onclick="submitAdminLogin()">
          <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
        </button>
        <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px;justify-content:center;" onclick="backToStep2()">
          <i class="fas fa-arrow-left"></i> กลับ
        </button>
      </div>
    </div>
  </div>

  <footer class="site-footer site-footer--dark" style="margin-top:6px;">© 2026 | 95110 · IMRON SAMOH<br>imron.samoh@gmail.com</footer>

  <script type="module" src="/src/pages/login.ts"></script>
</body>
</html>
